name: Debug ref context

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Probe
        run: |
          echo "event_name=$GITHUB_EVENT_NAME"
          echo "ref=$GITHUB_REF"
          echo "sha=$GITHUB_SHA"
      - name: If with ref_type
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: echo 'ref_type tag matched'
      - name: If with startsWith
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: echo 'startsWith matched'
