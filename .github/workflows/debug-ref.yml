name: Debug ref context

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  base:
    runs-on: ubuntu-24.04
    steps:
      - run: echo base

  job-if-ref-type:
    needs: base
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'job-level ref_type matched'

  job-if-startsWith:
    needs: base
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'job-level startsWith matched'

  job-if-write-permission:
    needs: base
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - run: echo 'job-level with contents write matched'
